<!DOCTYPE html>
<html>
<head>
    <title>User Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        .form-container {
            width: 400px;
            margin: 50px auto;
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
            color: #333333;
        }
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
            font-weight: bold;
            color: #555555;
        }
        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>User Registration</h2>
        <form action="register.jsp" method="post">
            <label for="username">User Name:</label>
            <input type="text"
                   id="username"
                   name="username"
                   required>
            <label for="password">Password:</label>
            <input type="password"
                   id="password"
                   name="password"
                   required>
            <label for="name">Name:</label>
            <input type="text"
                   id="name"
                   name="name"
                   required>
            <label for="ccnumber">Credit Card Number:</label>
            <input type="text"
                   id="ccnumber"
                   name="ccnumber"
                   pattern="[0-9]{13,19}"
                   maxlength="19"
                   required>
            <label for="email">Email:</label>
            <input type="email"
                   id="email"
                   name="email"
                   required>
            <label for="phone">Phone Number:</label>
            <input type="tel"
                   id="phone"
                   name="phone"
                   pattern="[0-9]{10}"
                   maxlength="10"
                   required>
            <input type="submit" value="Register">
        </form>
    </div>
</body>
</html>

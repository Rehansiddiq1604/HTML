<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f5f5dc;
            text-align: center;
        }

        .login {
            width: 400px;
            margin: 80px auto;
            background-color: white;
            padding: 25px;
            border: 1px solid #800000;
        }

        h1 {
            color: #800000;
        }

        input[type="text"],
        input[type="password"] {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        input[type="submit"] {
            background-color: #800000;
            color: white;
            padding: 10px 25px;
            border: none;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>Student Login</h1>

    <p>Enter your details to start the examination.</p>

    <form action="exam.html">

        <input type="text" placeholder="Enter Username" required>
        <br>

        <input type="password" placeholder="Enter Password" required>
        <br><br>

        <input type="submit" value="Login">

    </form>

</div>

</body>
</html>

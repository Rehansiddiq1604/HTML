<!DOCTYPE html>
<html>
<head>
    <title>NPTEL Exam Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #bdbade;
            margin: 0;
            padding: 30px;
        }

        .form-box {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #999;
        }

        h2 {
            text-align: center;
            color: #491fbf;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #176b87;
            outline: none;
            background-color: #f0fbfd;
        }

        .gender {
            margin-top: 8px;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        .gender label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }

        textarea {
            height: 70px;
            resize: none;
        }

        input[type="submit"] {
            margin-top: 25px;
            background-color: #176b87;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #0d4f66;
        }
    </style>
</head>

<body>

<div class="form-box">

    <h2>NPTEL Exam Registration</h2>

    <div class="subtitle">
        Register for NPTEL Certification Examination
    </div>

    <form action="validate.php" method="post">

        <label>Student Name</label>
        <input type="text" name="studentname"
               placeholder="Enter your full name">

        <label>Email ID</label>
        <input type="text" name="email"
               placeholder="example@gmail.com">

        <label>Phone Number</label>
        <input type="text" name="phone"
               placeholder="10 digit mobile number">

        <label>College Name</label>
        <input type="text" name="college"
               placeholder="Enter your college name">

        <label>Roll Number</label>
        <input type="text" name="rollnumber"
               placeholder="Enter roll number">

        <label>Date of Birth</label>
        <input type="date" name="dob">

        <label>Gender</label>

        <div class="gender">
            <label>
                <input type="radio" name="gender" value="Male">
                Male
            </label>

            <label>
                <input type="radio" name="gender" value="Female">
                Female
            </label>

            <label>
                <input type="radio" name="gender" value="Other">
                Other
            </label>
        </div>

        <label>Department</label>

        <select name="department">
            <option value="">Select Department</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics">Electronics</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
        </select>

        <label>NPTEL Course</label>

        <select name="course">
            <option value="">Select NPTEL Course</option>
            <option value="Programming in Java">Programming in Java</option>
            <option value="Data Structures and Algorithms">Data Structures and Algorithms</option>
            <option value="Python for Data Science">Python for Data Science</option>
            <option value="Cloud Computing">Cloud Computing</option>
            <option value="Database Management System">Database Management System</option>
        </select>

        <label>Exam Date</label>
        <input type="date" name="examdate">

        <label>Exam City</label>
        <input type="text" name="examcity"
               placeholder="Enter preferred exam city">

        <label>Address</label>

        <textarea name="address"
                  placeholder="Enter your address"></textarea>

        <label>Pincode</label>
        <input type="text" name="pincode"
               placeholder="6 digit pincode">

        <label>Registration Password</label>
        <input type="password" name="password"
               placeholder="Create a password">

        <label>Confirm Password</label>
        <input type="password" name="confirm_password"
               placeholder="Re-enter password">

        <input type="submit" value="Register for NPTEL Exam">

    </form>

</div>

</body>
</html>
